<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Life Counter</title>
<style>
  :root {
    --bg: #111418;
    --ink: #f2f4f7;
    --muted: #8a93a0;
    --gap: 10px;
    --radius: 18px;
    --c0: #2f5d8a; --c1: #8a3b3b; --c2: #3b7a52; --c3: #7a5a2f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  button { font: inherit; color: inherit; }

  /* Setup screen */
  #setup { height: 100%; display: flex; flex-direction: column; justify-content: safe center; gap: 20px; padding: 24px; max-width: 480px; margin: 0 auto; overflow-y: auto; }
  #names { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #names input, #rn-input { width: 100%; min-width: 0; padding: 12px; font-size: 17px; background: #1a1f26; border: 2px solid #2a313b; border-radius: 12px; color: var(--ink); }
  .mid .name { pointer-events: auto; padding: 4px 14px; border-bottom: 1px dotted rgba(255,255,255,.35); cursor: pointer; }
  #rename { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.75); display: none; align-items: center; justify-content: center; }
  #rename.on { display: flex; }
  #rename .card { width: min(88vw, 360px); background: #1a1f26; border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  #rename button { padding: 14px; font-size: 18px; border: 0; border-radius: 12px; background: #2a313b; }
  #rename button.save { background: #3d7be0; }
  #setup h1 { margin: 0; font-size: 28px; font-weight: 700; }
  .row { display: flex; gap: 10px; }
  .choice { flex: 1; padding: 18px 0; font-size: 24px; border: 2px solid #2a313b; background: #1a1f26; border-radius: 14px; }
  .choice.on { border-color: #6aa0e0; background: #22344a; }
  .label { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
  .start { padding: 20px; font-size: 22px; font-weight: 700; border: 0; border-radius: 14px; background: #3d7be0; }
  #life-input { width: 100%; padding: 14px; font-size: 22px; background: #1a1f26; border: 2px solid #2a313b; border-radius: 14px; color: var(--ink); text-align: center; }

  /* Game screen */
  #game { position: fixed; inset: 0; padding: calc(var(--gap) + env(safe-area-inset-top)) var(--gap) calc(var(--gap) + env(safe-area-inset-bottom)); display: none; }
  #game.on { display: block; }
  #board { height: 100%; display: grid; gap: var(--gap); }
  #board.n2 { grid-template-rows: 1fr 1fr; }
  #board.n3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  #board.n3 .p0 { grid-column: 1 / 3; }
  #board.n4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }

  #board.n3.side .p0 { grid-column: 1; grid-row: 1 / 3; }
  #board.n3.side .p1 { grid-column: 2; grid-row: 1; }
  #board.n3.side .p2 { grid-column: 2; grid-row: 2; }
  /* .rot holds a panel's contents; for the full-height side panel it is turned 90deg so the text reads from the left edge */
  .rot { position: absolute; inset: 0; display: flex; container-type: size; }
  .panel.side .rot, .panel.sideR .rot { inset: auto; left: 50%; top: 50%; width: 100cqh; height: 100cqw; }
  .panel.side .rot { transform: translate(-50%, -50%) rotate(90deg); }    /* reads from the left edge */
  .panel.sideR .rot { transform: translate(-50%, -50%) rotate(-90deg); }  /* reads from the right edge */
  .panel.side .life, .panel.sideR .life { font-size: min(44cqw, 40cqh); line-height: .8; }  /* these panels are short once turned */
  .panel { position: relative; border-radius: var(--radius); overflow: hidden; display: flex; }
  .panel.flip { transform: rotate(180deg); }
  .panel .zone { flex: 1; display: flex; align-items: center; border: 0; background: transparent; font-size: 36px; color: rgba(255,255,255,.55); }
  .panel .zone.minus { justify-content: flex-start; padding-left: 7%; }
  .panel .zone.plus { justify-content: flex-end; padding-right: 7%; }
  .panel .zone:active { background: rgba(255,255,255,.10); }
  /* Three rows: name above, life exactly in the middle, tally/warning/button below */
  .panel .mid { position: absolute; inset: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto minmax(0, 1fr); justify-items: center; pointer-events: none; }
  .mid .top { align-self: end; display: flex; flex-direction: column; align-items: center; }
  .mid .under { align-self: start; display: flex; flex-direction: column; align-items: center; }
  .panel { container-type: size; }
  .life { font-size: min(44cqw, 42cqh); font-weight: 800; line-height: 1; text-align: center; font-variant-numeric: tabular-nums; }
  .tally { height: 1.2em; font-size: 18px; color: rgba(255,255,255,.8); font-variant-numeric: tabular-nums; }
  .name { font-size: 15px; color: rgba(255,255,255,.7); }
  .panel.dead .life { opacity: .35; }
  .warn { font-size: 14px; font-weight: 700; color: #ffd36a; }
  .warn:empty { display: none; }

  /* Commander damage: small button per panel, opens a layer inside that panel (rotates with it) */
  .btnrow { display: flex; gap: 8px; margin-top: 4px; }
  .poisonbtn.lethal { border-color: #b6f06a; color: #b6f06a; }
  .poisonbtn, .cmdbtn { pointer-events: auto; border: 1px solid rgba(255,255,255,.35);
    background: rgba(0,0,0,.25); border-radius: 14px; padding: 6px 14px; font-size: 14px; color: rgba(255,255,255,.85); }
  .cmdlayer { position: absolute; inset: 0; z-index: 3; background: #0c0f13; display: none; flex-direction: column; padding: 10px 14px; gap: 6px; }
  .cmdlayer.on { display: flex; }
  .cmdlayer h3 { margin: 0; font-size: 14px; font-weight: 600; color: var(--muted); text-align: center; }
  .cmdrow { flex: 1; display: flex; align-items: center; gap: 10px; min-height: 0; }
  .cmdrow .who { flex: 1; font-size: 15px; color: rgba(255,255,255,.8); }
  .cmdrow button { width: 56px; height: 100%; max-height: 52px; font-size: 26px; border: 0; border-radius: 12px; background: #2a313b; }
  .cmdrow .n { width: 44px; text-align: center; font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .cmdrow.lethal .n { color: #ff7a6a; }
  .cmdrow .flag { font-size: 12px; color: #ff7a6a; min-width: 48px; }
  .cmddone { padding: 10px; font-size: 16px; border: 0; border-radius: 12px; background: #3d7be0; }

  /* Menu: small, away from the tap zones, needs two steps to reset */
  #menu-btn { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 5;
    width: 44px; height: 44px; border-radius: 50%; border: 2px solid #3a4350; background: #161a20; color: var(--muted); font-size: 20px; }
  #sheet { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.75); display: none; align-items: center; justify-content: center; }
  /* Rules reference: full-screen, scrolls, text is selectable */
  #ref { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: none; flex-direction: column; touch-action: pan-y; }
  #ref.on { display: flex; }
  #ref, #ref * { user-select: text; -webkit-user-select: text; }
  #ref .bar { display: flex; gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 12px 10px; border-bottom: 1px solid #2a313b; }
  #ref .bar input { flex: 1; min-width: 0; padding: 12px 14px; font-size: 17px; background: #1a1f26; border: 2px solid #2a313b; border-radius: 12px; color: var(--ink); }
  #ref .bar button { padding: 0 16px; font-size: 16px; border: 0; border-radius: 12px; background: #3d7be0; }
  #ref .list { flex: 1; overflow-y: auto; padding: 10px 12px calc(20px + env(safe-area-inset-bottom)); }
  #ref details { background: #1a1f26; border-radius: 14px; margin-bottom: 8px; }
  #ref summary { list-style: none; padding: 16px; font-size: 19px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  #ref summary::-webkit-details-marker { display: none; }
  #ref summary .rn { font-size: 13px; font-weight: 500; color: var(--muted); }
  #ref .body { padding: 0 16px 16px; font-size: 16px; line-height: 1.45; }
  #ref .body h4 { margin: 14px 0 4px; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  #ref .body p { margin: 0; }
  #ref .body ul { margin: 0; padding-left: 20px; }
  #ref .body a { color: #7fb2ff; display: inline-block; padding: 8px 12px; margin: 6px 8px 0 0; border: 1px solid #34506f; border-radius: 10px; text-decoration: none; }
  #ref .meta { margin-top: 10px; font-size: 12px; color: var(--muted); }
  #ref .foot { font-size: 12px; color: var(--muted); padding: 8px 4px; line-height: 1.5; }
  #ref .foot a { color: #7fb2ff; }
  #ref .none { padding: 24px; text-align: center; color: var(--muted); }
  #sheet.on { display: flex; }
  #sheet .card { width: min(88vw, 360px); background: #1a1f26; border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  #sheet button { padding: 16px; font-size: 18px; border: 0; border-radius: 12px; background: #2a313b; }
  #sheet button.danger { background: #8a3b3b; }
</style>
</head>
<body>
<section id="setup">
  <h1>Life Counter</h1>
  <div>
    <div class="label">Players</div>
    <div class="row" id="count-row">
      <button class="choice" data-n="2">2</button>
      <button class="choice on" data-n="3">3</button>
      <button class="choice" data-n="4">4</button>
    </div>
  </div>
  <div id="layout-wrap">
    <div class="label">3-player layout</div>
    <div class="row" id="layout-row">
      <button class="choice on" data-v="top">Top + two</button>
      <button class="choice" data-v="side">Side + two</button>
    </div>
  </div>
  <div>
    <div class="label">Names (optional)</div>
    <div id="names"></div>
  </div>
  <div>
    <div class="label">Starting life</div>
    <input id="life-input" type="number" inputmode="numeric" value="40" min="1" max="999">
  </div>
  <div>
    <div class="label">Commander damage</div>
    <div class="row" id="cmd-row">
      <button class="choice on" data-v="1">On</button>
      <button class="choice" data-v="0">Off</button>
    </div>
  </div>
  <button class="start" id="start-btn">Start game</button>
  <button class="choice" id="ref-btn2" style="padding:14px 0;font-size:17px">Rules reference</button>
</section>

<section id="game"><div id="board"></div></section>
<button id="menu-btn" aria-label="Menu" hidden>&#9776;</button>
<div id="sheet"><div class="card">
  <button id="close-sheet">Back to game</button>
  <button id="undo-btn">Undo</button>
  <button id="ref-btn">Rules reference</button>
  <button id="fs-btn" hidden>Full screen</button>
  <button id="new-game" class="danger">New game&hellip;</button>
</div></div>

<div id="rename"><div class="card">
  <div class="label" id="rn-label">Name</div>
  <input id="rn-input" maxlength="14" autocomplete="off">
  <button class="save" id="rn-save">Save</button>
  <button id="rn-cancel">Cancel</button>
</div></div>

<div id="ref">
  <div class="bar"><input id="ref-q" type="search" placeholder="Search (e.g. hexproof)" autocomplete="off"><button id="ref-close">Close</button></div>
  <div class="list" id="ref-list"></div>
</div>

<script src="keywords.js"></script>
<script>
(function () {
  var KEY = 'mtg-life-counter-v1';
  var COLORS = ['var(--c0)', 'var(--c1)', 'var(--c2)', 'var(--c3)'];
  var state = null;

  function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  var $ = function (id) { return document.getElementById(id); };
  var count = 3;

  // ---- Setup
  $('count-row').addEventListener('click', function (e) {
    var b = e.target.closest('.choice'); if (!b) return;
    count = +b.dataset.n;
    [].forEach.call($('count-row').querySelectorAll('.choice'), function (c) { c.classList.toggle('on', c === b); });
    $('layout-wrap').style.display = count === 3 ? '' : 'none';
    buildNames();
  });
  // Optional names on the setup screen; typed values are kept when the player count changes.
  var setupNames = ['', '', '', ''];
  function buildNames() {
    var box = $('names'); box.innerHTML = '';
    for (var i = 0; i < count; i++) (function (i) {
      var inp = document.createElement('input');
      inp.maxLength = 14; inp.placeholder = 'Player ' + (i + 1); inp.value = setupNames[i]; inp.autocomplete = 'off';
      inp.addEventListener('input', function () { setupNames[i] = inp.value; });
      box.appendChild(inp);
    })(i);
  }
  buildNames();
  var layout = 'top';
  $('layout-row').addEventListener('click', function (e) {
    var b = e.target.closest('.choice'); if (!b) return;
    layout = b.dataset.v;
    [].forEach.call($('layout-row').querySelectorAll('.choice'), function (c) { c.classList.toggle('on', c === b); });
  });
  var cmdOn = true;
  $('cmd-row').addEventListener('click', function (e) {
    var b = e.target.closest('.choice'); if (!b) return;
    cmdOn = b.dataset.v === '1';
    [].forEach.call($('cmd-row').querySelectorAll('.choice'), function (c) { c.classList.toggle('on', c === b); });
  });
  $('start-btn').addEventListener('click', function () {
    var life = Math.max(1, Math.min(999, parseInt($('life-input').value, 10) || 40));
    state = { n: count, start: life, cmdOn: cmdOn, layout: count === 3 ? layout : 'top', players: [], hist: [] };
    for (var i = 0; i < count; i++) state.players.push({ name: (setupNames[i] || '').trim() || 'Player ' + (i + 1), life: life, cmd: {} });
    save(); showGame();
  });

  // ---- Game
  function layoutFlags(n, i) {
    // Players across the table from the bottom edge face the other way.
    if (n === 3 && state.layout === 'side') return false; // side panels are turned 90deg, not flipped
    if (n === 2) return i === 0;
    if (n === 3) return i === 0;
    return i < 2;
  }

  function showGame() {
    $('setup').style.display = 'none';
    $('game').classList.add('on');
    $('menu-btn').hidden = false;
    wakeLock();
    var board = $('board');
    var side = state.n === 3 && state.layout === 'side';
    board.className = 'n' + state.n + (side ? ' side' : '');
    board.innerHTML = '';
    state.players.forEach(function (p, i) {
      var el = document.createElement('div');
      el.className = 'panel p' + i + (layoutFlags(state.n, i) ? ' flip' : '') + (side ? (i === 0 ? ' side' : ' sideR') : '');
      el.style.background = COLORS[i];
      el.innerHTML = '<div class="rot">' +
        '<button class="zone minus" aria-label="Minus one life">&minus;</button>' +
        '<button class="zone plus" aria-label="Plus one life">+</button>' +
        '<div class="mid"><div class="top"><div class="name"></div><div class="tally"></div></div><div class="life"></div><div class="under"><div class="warn"></div>' +
        '<div class="btnrow"><button class="cmdbtn" aria-label="Commander damage">&#9876; Cmdr</button>' +
        '<button class="poisonbtn" aria-label="Poison counters">&#9760; 0</button></div></div></div>' +
        '<div class="cmdlayer"></div></div>';
      board.appendChild(el);
      el.querySelector('.name').addEventListener('click', function () { openRename(i); });
      el.querySelector('.poisonbtn').addEventListener('click', function () { openPoison(i); });
      if (state.cmdOn === false) el.querySelector('.cmdbtn').hidden = true;
      else el.querySelector('.cmdbtn').addEventListener('click', function () { openCmd(i); });
      bindZone(el.querySelector('.minus'), i, -1);
      bindZone(el.querySelector('.plus'), i, +1);
      render(i);
    });
  }

  var tallies = {}; // pending net change per player, shown for 1.5s
  function render(i) {
    var p = state.players[i], el = document.querySelector('.p' + i);
    el.querySelector('.name').textContent = p.name;
    el.querySelector('.life').textContent = p.life;
    var lethal = Object.keys(p.cmd || {}).some(function (j) { return p.cmd[j] >= 21; });
    var pz = p.poison || 0, pLethal = pz >= 10;
    el.classList.toggle('dead', p.life <= 0 || lethal || pLethal);
    el.querySelector('.warn').textContent = [lethal ? '⚠ 21 commander damage' : '', pLethal ? '☠ 10 poison' : ''].filter(Boolean).join(' · ');
    var pb = el.querySelector('.poisonbtn'); pb.textContent = '☠ ' + pz; pb.classList.toggle('lethal', pLethal);
    var t = tallies[i];
    el.querySelector('.tally').textContent = t && t.net ? (t.net > 0 ? '+' : '') + t.net : '';
  }

  // ---- History: rapid taps on the same thing merge into one entry
  function pushHist(e) {
    var h = state.hist || (state.hist = []), last = h[h.length - 1], now = Date.now();
    if (last && last.k === e.k && last.i === e.i && last.j === e.j && now - last.t < 1500) {
      last.d += e.d; last.t = now;
      if (last.d === 0) h.pop();
    } else { e.t = now; h.push(e); }
    if (h.length > 100) h.shift();
  }
  function describe(e) {
    var who = state.players[e.i].name, s = (e.d > 0 ? '+' : '−') + Math.abs(e.d);
    if (e.k === 'p') return who + ' poison ' + s;
    return e.k === 'c' ? who + ' cmdr dmg from ' + state.players[e.j].name + ' ' + s : who + ' life ' + s;
  }
  // Re-draw whichever layer (commander or poison) is on a panel
  function refreshLayer(i) {
    var layer = document.querySelector('.p' + i + ' .cmdlayer');
    if (layer && layer.dataset.mode === 'poison') renderPoison(i); else renderCmd(i);
  }
  function refreshUndo() {
    var h = state && state.hist || [], b = $('undo-btn');
    b.disabled = !h.length;
    b.textContent = h.length ? 'Undo: ' + describe(h[h.length - 1]) : 'Nothing to undo';
  }
  $('undo-btn').addEventListener('click', function () {
    var h = state.hist || [], e = h.pop(); if (!e) return;
    if (e.k === 'c') {
      state.players[e.i].cmd[e.j] = Math.max(0, (state.players[e.i].cmd[e.j] || 0) - e.d);
      state.players[e.i].life += e.d;   // commander damage also cost life; give it back
      refreshLayer(e.i);
    } else if (e.k === 'p') {
      state.players[e.i].poison = Math.max(0, (state.players[e.i].poison || 0) - e.d);
      refreshLayer(e.i);
    } else state.players[e.i].life -= e.d;
    save(); render(e.i); refreshUndo();
  });

  // ---- Rename a player: tap the name in their panel
  var renaming = -1;
  function openRename(i) {
    renaming = i;
    $('rn-label').textContent = 'Name for ' + 'Player ' + (i + 1);
    $('rn-input').value = state.players[i].name;
    $('rename').classList.add('on');
    setTimeout(function () { $('rn-input').focus(); $('rn-input').select(); }, 50);
  }
  function closeRename() { $('rename').classList.remove('on'); renaming = -1; }
  function saveRename() {
    if (renaming < 0) return;
    var i = renaming, v = $('rn-input').value.trim();
    state.players[i].name = v || 'Player ' + (i + 1);
    save(); render(i);
    // keep any open commander layers (they list other players' names) in step
    state.players.forEach(function (p, j) {
      var layer = document.querySelector('.p' + j + ' .cmdlayer');
      if (layer && layer.classList.contains('on')) refreshLayer(j);
    });
    closeRename();
  }
  $('rn-save').addEventListener('click', saveRename);
  $('rn-cancel').addEventListener('click', closeRename);
  $('rn-input').addEventListener('keydown', function (e) { if (e.key === 'Enter') saveRename(); });

  // ---- Commander damage layer (per panel, per opponent; never touches life)
  function openCmd(i) {
    var layer = document.querySelector('.p' + i + ' .cmdlayer');
    layer.classList.add('on'); renderCmd(i);
  }
  function renderCmd(i) {
    var p = state.players[i], layer = document.querySelector('.p' + i + ' .cmdlayer');
    p.cmd = p.cmd || {};
    layer.dataset.mode = 'cmd';
    layer.innerHTML = '<h3></h3>';
    layer.querySelector('h3').textContent = 'Commander damage ' + p.name + ' has taken';
    state.players.forEach(function (o, j) {
      if (j === i) return;
      var n = p.cmd[j] || 0, row = document.createElement('div');
      row.className = 'cmdrow' + (n >= 21 ? ' lethal' : '');
      row.innerHTML = '<div class="who"></div><button aria-label="Minus">&minus;</button><div class="n"></div><button aria-label="Plus">+</button><div class="flag">' + (n >= 21 ? 'Lethal' : '') + '</div>';
      row.querySelector('.who').textContent = 'from ' + o.name;
      row.querySelector('.n').textContent = n;
      var b = row.querySelectorAll('button');
      b[0].addEventListener('click', function () { cmdChange(i, j, -1); });
      b[1].addEventListener('click', function () { cmdChange(i, j, 1); });
      layer.appendChild(row);
    });
    var done = document.createElement('button');
    done.className = 'cmddone'; done.textContent = 'Done';
    done.addEventListener('click', function () { layer.classList.remove('on'); });
    layer.appendChild(done);
  }
  function cmdChange(i, j, d) {
    var p = state.players[i]; p.cmd = p.cmd || {};
    var old = p.cmd[j] || 0, n = Math.max(0, old + d);
    if (n === old) return;
    // Traditional rule: commander damage is also damage, so life drops by the same amount.
    p.cmd[j] = n; p.life -= n - old; pushHist({ k: 'c', i: i, j: j, d: n - old });
    save(); renderCmd(i); render(i);
  }

  // ---- Poison layer: 10 or more poison counters loses (CR 704.5c). Separate from life.
  function openPoison(i) {
    var layer = document.querySelector('.p' + i + ' .cmdlayer');
    layer.classList.add('on'); renderPoison(i);
  }
  function renderPoison(i) {
    var p = state.players[i], layer = document.querySelector('.p' + i + ' .cmdlayer'), n = p.poison || 0;
    layer.dataset.mode = 'poison';
    layer.innerHTML = '<h3></h3>';
    layer.querySelector('h3').textContent = 'Poison counters on ' + p.name;
    var row = document.createElement('div');
    row.className = 'cmdrow' + (n >= 10 ? ' lethal' : '');
    row.innerHTML = '<div class="who">10 loses</div><button aria-label="Minus">&minus;</button><div class="n"></div><button aria-label="Plus">+</button><div class="flag">' + (n >= 10 ? 'Lethal' : '') + '</div>';
    row.querySelector('.n').textContent = n;
    var b = row.querySelectorAll('button');
    b[0].addEventListener('click', function () { poisonChange(i, -1); });
    b[1].addEventListener('click', function () { poisonChange(i, 1); });
    layer.appendChild(row);
    var done = document.createElement('button');
    done.className = 'cmddone'; done.textContent = 'Done';
    done.addEventListener('click', function () { layer.classList.remove('on'); });
    layer.appendChild(done);
  }
  function poisonChange(i, d) {
    var p = state.players[i], old = p.poison || 0, n = Math.max(0, old + d);
    if (n === old) return;
    p.poison = n; pushHist({ k: 'p', i: i, j: -1, d: n - old });
    save(); renderPoison(i); render(i);
  }

  function change(i, d) {
    pushHist({ k: 'l', i: i, j: -1, d: d });
    state.players[i].life += d;
    var t = tallies[i] || (tallies[i] = { net: 0, timer: null });
    t.net += d;
    clearTimeout(t.timer);
    t.timer = setTimeout(function () { t.net = 0; render(i); }, 1500);
    save(); render(i);
  }

  // Tap = 1. Hold 0.5s = jumps of 5, repeating. Pointer is captured so a drag
  // onto a neighbouring panel never changes that panel.
  function bindZone(btn, i, dir) {
    var holdTimer, repeat, held = false;
    function stop() { clearTimeout(holdTimer); clearInterval(repeat); }
    btn.addEventListener('pointerdown', function (e) {
      try { btn.setPointerCapture(e.pointerId); } catch (x) {}
      held = false;
      holdTimer = setTimeout(function () {
        held = true; change(i, 5 * dir);
        repeat = setInterval(function () { change(i, 5 * dir); }, 450);
      }, 500);
    });
    btn.addEventListener('pointerup', function (e) {
      var wasHeld = held; stop();
      if (wasHeld) return;
      var r = btn.getBoundingClientRect();
      var inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
      if (inside) change(i, dir);
    });
    btn.addEventListener('pointercancel', stop);
    btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  }

  // ---- Menu (two deliberate steps to wipe a game)
  $('menu-btn').addEventListener('click', function () { $('sheet').classList.add('on'); refreshUndo(); armed = false; $('new-game').textContent = 'New game…'; });
  $('close-sheet').addEventListener('click', function () { $('sheet').classList.remove('on'); });
  var armed = false;
  $('new-game').addEventListener('click', function () {
    if (!armed) { armed = true; this.textContent = 'Tap again: erase this game'; return; }
    try { localStorage.removeItem(KEY); } catch (e) {}
    state = null; location.reload();
  });

  // ---- Rules reference (data lives in keywords.js)
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function renderRef(filter) {
    var K = (window.KEYWORDS || []).slice().sort(function (a, b) { return a.name.localeCompare(b.name); }),
        M = window.KEYWORDS_META || {}, f = (filter || '').trim().toLowerCase();
    var html = K.filter(function (k) {
      return !f || (k.name + ' ' + k.summary + ' ' + (k.misread || '') + ' ' + k.rules.map(function (r) { return r.label; }).join(' ')).toLowerCase().indexOf(f) !== -1;
    }).map(function (k) {
      return '<details' + (f ? ' open' : '') + '><summary><span>' + esc(k.name) + '</span><span class="rn">CR ' + esc(k.rules[0].label) + '</span></summary><div class="body">' +
        '<p>' + esc(k.summary) + '</p>' +
        (k.doesNot && k.doesNot.length ? '<h4>Does NOT</h4><ul>' + k.doesNot.map(function (d) { return '<li>' + esc(d) + '</li>'; }).join('') + '</ul>' : '') +
        (k.misread ? '<h4>Common misread</h4><p>' + esc(k.misread) + '</p>' : '') +
        '<div>' + k.rules.map(function (r) { return '<a href="' + esc((M.linkBase || '') + r.id) + '" target="_blank" rel="noopener noreferrer">Rule ' + esc(r.label) + ' &#8599;</a>'; }).join('') + '</div>' +
        '<div class="meta">Checked against the rules of ' + esc(M.edition || '') + ' on ' + esc(k.verified || '') + '</div></div></details>';
    }).join('');
    $('ref-list').innerHTML = (html || '<div class="none">Nothing matches.</div>') +
      '<div class="foot">Plain-English summaries, not official text. Rule links open a fan-run copy of the Comprehensive Rules (effective ' + esc(M.edition || '') +
      '); the official rules are at <a href="' + esc(M.officialUrl || '#') + '" target="_blank" rel="noopener noreferrer">magic.wizards.com</a>.</div>';
  }
  function openRef() { $('ref-q').value = ''; renderRef(''); $('ref').classList.add('on'); $('ref-list').scrollTop = 0; }
  $('ref-btn').addEventListener('click', openRef);
  $('ref-btn2').addEventListener('click', openRef);
  $('ref-close').addEventListener('click', function () { $('ref').classList.remove('on'); $('sheet').classList.remove('on'); });
  $('ref-q').addEventListener('input', function () { renderRef(this.value); });

  // ---- Full screen (button only appears where the browser supports it; hidden when installed to the home screen)
  var fsBtn = $('fs-btn'), de = document.documentElement;
  var canFs = !!(de.requestFullscreen) && !window.matchMedia('(display-mode: fullscreen)').matches && !window.matchMedia('(display-mode: standalone)').matches;
  function fsLabel() { fsBtn.textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen'; }
  if (canFs) {
    fsBtn.hidden = false; fsLabel();
    fsBtn.addEventListener('click', function () {
      if (document.fullscreenElement) document.exitFullscreen(); else de.requestFullscreen({ navigationUI: 'hide' }).catch(function () {});
    });
    document.addEventListener('fullscreenchange', fsLabel);
  }

  // ---- Offline / installable (service worker needs https or localhost)
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }

  // ---- Keep screen on during a game (ignored where unsupported)
  var lock = null;
  function wakeLock() {
    if (!('wakeLock' in navigator)) return;
    navigator.wakeLock.request('screen').then(function (l) { lock = l; }).catch(function () {});
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && state) wakeLock(); });

  // ---- Boot: resume a saved game after refresh
  var saved = load();
  if (saved && saved.players && saved.players.length) { state = saved; showGame(); }
})();
</script>
</body>
</html>
